name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      created: ${{ steps.release.outputs.releases_created }}
      server_tag: ${{ steps.release.outputs.tag_name }}
      cli_tag: ${{ steps.release.outputs['cli--tag_name'] }}
      protocol_tag: ${{ steps.release.outputs['protocol--tag_name'] }}
      sha: ${{ steps.release.outputs.sha || steps.release.outputs['cli--sha'] || steps.release.outputs['protocol--sha'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Verify releases share the checked commit
        if: steps.release.outputs.releases_created == 'true'
        env:
          SERVER_SHA: ${{ steps.release.outputs.sha }}
          CLI_SHA: ${{ steps.release.outputs['cli--sha'] }}
          PROTOCOL_SHA: ${{ steps.release.outputs['protocol--sha'] }}
        run: |
          release_sha="${SERVER_SHA:-${CLI_SHA:-$PROTOCOL_SHA}}"
          for sha in "$SERVER_SHA" "$CLI_SHA" "$PROTOCOL_SHA"; do
            if [ -n "$sha" ]; then test "$sha" = "$release_sha"; fi
          done
      - uses: actions/checkout@v4
        if: steps.release.outputs.prs_created == 'true'
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - uses: astral-sh/setup-uv@v10.0.1
        if: steps.release.outputs.prs_created == 'true'
        with:
          version: "0.8.13"
      - name: Synchronize the release PR lockfile
        if: steps.release.outputs.prs_created == 'true'
        run: |
          uv lock
          if ! git diff --quiet -- uv.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add uv.lock
            git commit -m 'chore: sync release lockfile'
            git push
          fi

  checks:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.release.outputs.sha }}

  publish:
    needs: [release, checks]
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Group packages in dependency order
        run: |
          mkdir -p packages/protocol packages/cli packages/server
          mv dist/octomate_protocol-* packages/protocol/
          mv dist/octomate_cli-* packages/cli/
          mv dist/octomate-* packages/server/
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: needs.release.outputs.protocol_tag != ''
        with:
          packages-dir: packages/protocol/
          skip-existing: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: needs.release.outputs.cli_tag != ''
        with:
          packages-dir: packages/cli/
          skip-existing: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: needs.release.outputs.server_tag != ''
        with:
          packages-dir: packages/server/
          skip-existing: true
      - name: Attach each package to its release
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_TAG: ${{ needs.release.outputs.server_tag }}
          CLI_TAG: ${{ needs.release.outputs.cli_tag }}
          PROTOCOL_TAG: ${{ needs.release.outputs.protocol_tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -n "$PROTOCOL_TAG" ]; then
            gh release upload "$PROTOCOL_TAG" packages/protocol/* --clobber
          fi
          if [ -n "$CLI_TAG" ]; then
            gh release upload "$CLI_TAG" packages/cli/* --clobber
          fi
          if [ -n "$SERVER_TAG" ]; then
            gh release upload "$SERVER_TAG" packages/server/* --clobber
          fi
