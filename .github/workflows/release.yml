name: Release

on:
  push:
    branches: [main]
    paths:
      - "octomate/**"
      - "cli/**"
      - "protocol/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "LICENSE"
      - "CHANGELOG.md"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "alembic.ini"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - ".github/workflows/release.yml"
      - ".github/release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      created: ${{ steps.release.outputs.releases_created }}
      packages: ${{ steps.packages.outputs.matrix }}
      sha: ${{ steps.release.outputs.sha || steps.release.outputs['cli--sha'] || steps.release.outputs['protocol--sha'] }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install --prefix "$RUNNER_TEMP/release-please" --ignore-scripts --no-audit --no-fund release-please@17.3.0
      - name: Update package releases
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          NODE_PATH: ${{ runner.temp }}/release-please/node_modules
        run: node .github/release/run.cjs
      - name: Verify releases share the checked commit
        if: steps.release.outputs.releases_created == 'true'
        env:
          SERVER_SHA: ${{ steps.release.outputs.sha }}
          CLI_SHA: ${{ steps.release.outputs['cli--sha'] }}
          PROTOCOL_SHA: ${{ steps.release.outputs['protocol--sha'] }}
        run: |
          release_sha="${SERVER_SHA:-${CLI_SHA:-$PROTOCOL_SHA}}"
          for sha in "$SERVER_SHA" "$CLI_SHA" "$PROTOCOL_SHA"; do
            if [ -n "$sha" ]; then test "$sha" = "$release_sha"; fi
          done
      - name: Select released packages
        id: packages
        if: steps.release.outputs.releases_created == 'true'
        env:
          SERVER_TAG: ${{ steps.release.outputs.tag_name }}
          CLI_TAG: ${{ steps.release.outputs['cli--tag_name'] }}
          PROTOCOL_TAG: ${{ steps.release.outputs['protocol--tag_name'] }}
        run: |
          matrix=$(jq -cn \
            --arg server "$SERVER_TAG" --arg cli "$CLI_TAG" --arg protocol "$PROTOCOL_TAG" \
            '{include: [
              {package: "protocol", distribution: "octomate_protocol", tag: $protocol},
              {package: "cli", distribution: "octomate_cli", tag: $cli},
              {package: "server", distribution: "octomate", tag: $server}
            ] | map(select(.tag != ""))}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.release.outputs.prs_created == 'true'
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - uses: astral-sh/setup-uv@v10.0.1
        if: steps.release.outputs.prs_created == 'true'
        with:
          version: "0.8.13"
      - name: Synchronize the release PR lockfile
        if: steps.release.outputs.prs_created == 'true'
        run: |
          uv lock
          if ! git diff --quiet -- uv.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add uv.lock
            git commit -m 'chore: sync release lockfile'
            git push
          fi

  checks:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.release.outputs.sha }}

  trunkline:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/trunkline.yml
    with:
      ref: ${{ needs.release.outputs.sha }}

  publish:
    name: Publish ${{ matrix.package }}
    needs: [release, checks, trunkline]
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release.outputs.packages) }}
    environment: pypi-${{ matrix.package }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Select package distributions
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          mkdir package
          mv dist/"$DISTRIBUTION"-* package/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: package/
          skip-existing: true
      - name: Attach package to its release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ matrix.tag }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" package/* --clobber
