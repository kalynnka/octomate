name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            perf
          subjectPattern: '^[a-z].*$'
          subjectPatternError: >-
            The description in "{title}" must start with a lowercase letter.
        env:
          GITHUB_TOKEN: ${{ github.token }}
