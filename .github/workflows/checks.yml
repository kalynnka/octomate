name: Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "octomate/**"
      - "cli/**"
      - "protocol/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "README.md"
      - "LICENSE"
      - "alembic.ini"
      - "docker-compose.yml"
      - ".github/checks/**"
      - ".github/workflows/checks.yml"
  push:
    branches: [main]
    paths:
      - "octomate/**"
      - "cli/**"
      - "protocol/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "README.md"
      - "LICENSE"
      - "alembic.ini"
      - "docker-compose.yml"
      - ".github/checks/**"
      - ".github/workflows/checks.yml"
  workflow_dispatch:
    inputs:
      integration_tests:
        description: Run native sandbox integration tests
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  lint:
    name: Ruff and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.8.13"
          python-version: "3.12"
          enable-cache: true
          cache-suffix: checks
      - run: uv sync --locked
      - name: Check changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: uv run --no-sync python .github/checks/changed.py "$BASE_SHA"

  test:
    name: Unit tests (Python ${{ matrix.python }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.8.13"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-suffix: checks
      - run: uv sync --locked
      - name: Run unit tests
        run: uv run --no-sync pytest -q -n 2 --dist worksteal --durations=25

  integration-tests:
    name: Integration tests (${{ matrix.harness }})
    if: github.event_name == 'workflow_dispatch' && inputs.integration_tests
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        harness: [inkling, codex, claude, deepseek]
    env:
      NATIVE_HARNESS: ${{ matrix.harness }}
      NATIVE_JUNIT: native-sandbox-results/${{ matrix.harness }}.xml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.8.13"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: native-sandbox-${{ matrix.harness }}
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        if: matrix.harness == 'deepseek'
        with:
          node-version: "22.23.2"
      - name: Install DeepSeek runtime and scripted-provider API
        if: matrix.harness == 'deepseek'
        run: |
          npm install --prefix "$RUNNER_TEMP/native-dsh" --no-audit --no-fund \
            @deepseek-ai/dsh@0.2.1-rc.2 @deepseek-ai/dsh-llm@0.2.1-rc.2
          echo "DSH_TEST_EXECUTABLE=$RUNNER_TEMP/native-dsh/node_modules/.bin/dsh" >> "$GITHUB_ENV"
      - name: Run strict native integration tests
        id: tests
        run: >-
          uv run --no-sync pytest tests/integration/native_sandbox
          --native-sandbox -k "$NATIVE_HARNESS" -ra
          --junitxml="$NATIVE_JUNIT"
      - name: Summarize harness results
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from collections import Counter

          cases = list(ET.parse(os.environ["NATIVE_JUNIT"]).iter("testcase"))
          counts = Counter(
              "skipped" if case.find("skipped") is not None else
              "failed" if case.find("failure") is not None else
              "errors" if case.find("error") is not None else "passed"
              for case in cases
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### {os.environ['NATIVE_HARNESS']} native sandbox\n\n")
              summary.write("| Passed | Failed | Errors | Skipped |\n|---:|---:|---:|---:|\n")
              summary.write(
                  f"| {counts['passed']} | {counts['failed']} | "
                  f"{counts['errors']} | {counts['skipped']} |\n"
              )
          if not cases or counts["skipped"] == len(cases):
              raise SystemExit("No native integration cases executed; check runtime prerequisites.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-sandbox-${{ matrix.harness }}
          path: ${{ env.NATIVE_JUNIT }}
          if-no-files-found: warn

  packages:
    name: Packages (Python ${{ matrix.python }})
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.8.13"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-suffix: checks
      - run: uv sync --locked
      - name: Build all distributions
        run: uv build --all-packages --no-sources
      - name: Validate distribution metadata
        run: uvx twine check dist/*
      - name: Test installed packages outside the checkout
        run: uv run --no-sync python .github/checks/distributions.py
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
