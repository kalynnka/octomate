name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.8.13"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - name: Check changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: uv run --no-sync python .github/checks/changed.py "$BASE_SHA"
      - name: Test
        run: uv run --no-sync pytest -q
      - name: Build all distributions
        run: uv build --all-packages --no-sources
      - name: Validate distribution metadata
        run: uvx twine check dist/*
      - name: Test installed packages outside the checkout
        run: uv run --no-sync python .github/checks/distributions.py
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
