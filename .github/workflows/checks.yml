name: Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "octomate/**"
      - "cli/**"
      - "protocol/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "README.md"
      - "LICENSE"
      - "alembic.ini"
      - "docker-compose.yml"
      - ".github/checks/**"
      - ".github/workflows/checks.yml"
  push:
    branches: [main]
    paths:
      - "octomate/**"
      - "cli/**"
      - "protocol/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "README.md"
      - "LICENSE"
      - "alembic.ini"
      - "docker-compose.yml"
      - ".github/checks/**"
      - ".github/workflows/checks.yml"
  workflow_dispatch:
    inputs:
      integration_tests:
        description: Run native sandbox integration tests
        type: boolean
        default: false
      sbx_tests:
        description: Run real microVM acceptance on an sbx-equipped runner
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

# A new push to a pull request cancels its stale run; pushes and release calls
# each keep a group of their own.
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Ruff and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.8.13"
          python-version: "3.12"
          enable-cache: true
          cache-suffix: checks
      - run: uv sync --locked
      - name: Check changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: uv run --no-sync python .github/checks/changed.py "$BASE_SHA"

  migrations:
    name: Alembic migrations
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: checks
      - run: uv sync --locked
      - name: Upgrade a database at the base's head to this head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: uv run --no-sync pytest -q tests/migrations --migration-base "$BASE_SHA"

  test:
    name: Unit tests · ${{ matrix.suite }} (${{ matrix.python }})
    needs: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test the deployed Python; main and releases test every
        # supported one.
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.13"]' || '["3.12", "3.13", "3.14", "3.15"]') }}
        suite:
          - agent-core
          - agent-codex
          - agent-claude
          - agent-acp
          - agent-deepseek
          - agent-inkling
          - channels
          - cli
          - tools
          - workspaces
          - habitat
          - core
        include:
          - suite: agent-core
            paths: tests/agent/core
          - suite: agent-codex
            paths: tests/agent/codex tests/habitat/agents/test_codex.py
          - suite: agent-claude
            paths: tests/agent/claude tests/habitat/agents/test_claude.py
          - suite: agent-acp
            paths: tests/agent/acp tests/habitat/agents/test_acp.py
          - suite: agent-deepseek
            paths: tests/agent/deepseek tests/habitat/agents/test_deepseek.py
          - suite: agent-inkling
            paths: tests/agent/inkling tests/habitat/agents/test_inkling.py tests/habitat/agents/test_inkling_workspace.py
          - suite: channels
            paths: tests/channels
          - suite: cli
            paths: tests/cli
          - suite: tools
            paths: tests/tools
          - suite: workspaces
            paths: tests/workspaces
          - suite: habitat
            paths: tests/habitat --ignore=tests/habitat/agents
          # Everything the suites above and the migrations job do not name, so a
          # new test folder runs here until it is given a suite of its own.
          - suite: core
            paths: >-
              tests
              --ignore=tests/habitat
              --ignore=tests/migrations
              --ignore=tests/integration
              --ignore=tests/channels
              --ignore=tests/cli
              --ignore=tests/tools
              --ignore=tests/workspaces
              --ignore=tests/agent/core
              --ignore=tests/agent/codex
              --ignore=tests/agent/claude
              --ignore=tests/agent/acp
              --ignore=tests/agent/deepseek
              --ignore=tests/agent/inkling
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-suffix: checks
      - run: uv sync --locked
      - name: Run unit tests
        env:
          SUITE_PATHS: ${{ matrix.paths }}
        run: |
          read -ra paths <<< "$SUITE_PATHS"
          uv run --no-sync pytest -q -n 4 --dist worksteal --durations=25 "${paths[@]}"

  packages:
    name: Packages (Python ${{ matrix.python }})
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.13"]' || '["3.12", "3.13", "3.14", "3.15"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-suffix: checks
      - run: uv sync --locked
      - name: Build all distributions
        run: uv build --all-packages --no-sources
      - name: Validate distribution metadata
        run: uvx twine check dist/*
      - name: Test installed packages outside the checkout
        run: uv run --no-sync python .github/checks/distributions.py
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
