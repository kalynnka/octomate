name: Docs

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      upload-pages:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.8.13"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: docs
      - name: Install documentation dependencies
        run: uv sync --locked --only-group docs
      - name: Build guide and API reference
        run: uv run --no-sync mkdocs build --strict
      - name: Upload Pages artifact
        if: inputs.upload-pages && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
