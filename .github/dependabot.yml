version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      python-security:
        applies-to: "security-updates"
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/trunkline"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      trunkline-security:
        applies-to: "security-updates"
        patterns: ["*"]
