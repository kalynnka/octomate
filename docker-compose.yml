# The wizard copies this layout into an installation and sets its build path,
# host UID/GID and loopback port. No database or account is initialized on startup.
services:
  octomate:
    build: .
    init: true
    user: "1000:1000"
    restart: unless-stopped
    env_file:
      - path: ./state/.env
        required: false
    environment:
      HOME: /home/octomate
      OCTOMATE_HOME: /data/config
      OCTOMATE_DB_URL: sqlite+aiosqlite:////data/octomate.db
      # The server is reachable only through the private Compose network.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - ./state:/data
      - ./agent-home:/home/octomate

  trunkline:
    build:
      context: .
      dockerfile: trunkline/Dockerfile
    restart: unless-stopped
    depends_on:
      - octomate
    ports:
      - "127.0.0.1:8000:8080"

