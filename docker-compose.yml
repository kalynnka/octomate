services:
  octomate:
    build: .
    container_name: octomate
    restart: always
    profiles:
      - app
    environment:
      UV_LINK_MODE: copy
    volumes:
      - .:/app
      - /app/.venv
    command: ["uv", "run", "uvicorn", "main:app", "--reload", "--reload-dir", "octomate", "--reload-dir", "octotools", "--host", "0.0.0.0"]
    networks:
      - octomate_network

  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: always
    # mac_address: 02:42:ac:11:00:02  # 添加MAC地址固化配置
    environment:
      - NAPCAT_UID=${NAPCAT_UID:-0}
      - NAPCAT_GID=${NAPCAT_GID:-0}
    ports:
      - 3001:3001
      - 3002:3002
      - 6099:6099
    volumes:
      - napcat_config:/app/napcat/config
      - napcat_qq:/app/.config/QQ
    networks:
      - octomate_network

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - milvus_etcd:/etcd
    command: >
      etcd -advertise-client-urls=http://milvus-etcd:2379
           -listen-client-urls=http://0.0.0.0:2379
           --data-dir /etcd
    networks:
      - octomate_network

  milvus-rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
    volumes:
      - milvus_rustfs:/data
    networks:
      - octomate_network

  milvus:
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-rustfs:9000
    ports:
      - 19530:19530
    depends_on:
      - milvus-etcd
      - milvus-rustfs
    networks:
      - octomate_network

  attu:
    image: zilliz/attu:latest
    restart: always
    environment:
      MILVUS_URL: http://milvus:19530
    ports:
      - 3000:3000
    depends_on:
      - milvus
    networks:
      - octomate_network

  postgres:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: octomate
      POSTGRES_PASSWORD: octomate
      POSTGRES_DB: octomate
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - octomate_network

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@octomate.ai
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - 8080:80
    volumes:
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres
    networks:
      - octomate_network

networks:
  octomate_network:
    driver: bridge

volumes:
  napcat_config:
  napcat_qq:
  milvus_etcd:
  milvus_rustfs:
  postgres_data:
