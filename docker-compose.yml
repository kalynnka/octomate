# `docker compose up -d` starts Octomate and nothing else: the database is a SQLite
# file under `.octomate/`, so there is no service to stand up for it.
#
# QQ needs a NapCat bridge to talk to, which is a QQ account rather than a piece of
# infrastructure — it is behind a profile so it starts only when asked:
#
#   docker compose --profile qq up -d
services:
  octomate:
    build: .
    container_name: octomate
    restart: always
    env_file:
      - .env
    environment:
      UV_LINK_MODE: copy
      # The config default binds loopback, which inside a container is reachable
      # from nowhere. Lark webhooks, OAuth callbacks and the dev UI all arrive here.
      OCTOMATE__HOST: 0.0.0.0
    ports:
      - 8000:8000
    volumes:
      - .:/app
      - /app/.venv
      # `agents.claude.ssh` runs Claude Code on another host through the system ssh.
      - ~/.ssh:/root/.ssh:ro
    networks:
      - octomate_network

  napcat:
    profiles: [qq]
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: always
    environment:
      - NAPCAT_UID=${NAPCAT_UID:-0}
      - NAPCAT_GID=${NAPCAT_GID:-0}
    ports:
      - 3001:3001
      - 3002:3002
      - 6099:6099
    volumes:
      - napcat_config:/app/napcat/config
      - napcat_qq:/app/.config/QQ
    networks:
      - octomate_network

networks:
  octomate_network:
    driver: bridge

volumes:
  napcat_config:
  napcat_qq:
