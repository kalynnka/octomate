[project]
name = "octomate"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2",
    "pyyaml>=6",
    "websockets>=15",
    "lark-oapi>=1.4.8",
    "pydantic-ai[bedrock]>=2.20.0",
    "pydantic-graph>=2.20.0",
    "pydantic-ai-harness>=0.14",
    "watchfiles>=1.1.1",
    "arcanus>=0.0.25",
    "sqlalchemy[aiosqlite]>=2.0",
    "uuid-utils>=0.9",
    "alembic>=1.15",
    "aiosqlite>=0.22.1",
    # slack-bolt's async socket-mode handler needs aiohttp but does not declare it;
    # it used to arrive transitively through langchain.
    "aiohttp>=3.9",
    "slack-bolt>=1.18",
    "claude-agent-sdk>=0.1",
    "cryptography>=48",
    "google-genai>=1.55.0",
    "uvicorn>=0.34",
    "logfire[httpx,sqlalchemy]>=4.29.0",
    "rich>=13",
    "openai-codex>=0.1.0b3",
    "typer>=0.25.1",
]

[project.scripts]
octomate = "octomate.cli.base:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["octomate"]

[tool.ruff]
# The whole tree is `ruff format`ed at this width. Pinned rather than left implicit so
# a ruff upgrade cannot reflow every file at once; `target-version` stays inferred from
# `requires-python`.
line-length = 88

[tool.ruff.lint]
# Ruff's default set (pyflakes + the pycodestyle errors it enables by default), pinned
# for the same reason.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]

[dependency-groups]
dev = [
    "watchfiles>=1.1.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "fastapi>=0.115",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    # Channel profile schemas intentionally redeclare UserProfile fields (platform
    # aliases/defaults); the transmuter metaclass serves same-named class attributes,
    # which pydantic reports as shadowing. Mirrors the runtime filter in octomate/__init__.py,
    # which pytest's per-phase warning state does not preserve for late channel imports.
    'ignore:Field name "\w+" in "\w*(UserProfile|Sender)" shadows:UserWarning',
]
markers = [
    "trigger: live replay against a real IM client (needs octomate.yaml credentials); auto-skipped unless explicitly targeted",
]

[tool.logfire]
# Instrumented code paths (e.g. ChannelTentacle.ingest) run in tests and other
# entrypoints that never call logfire.configure(); silence the per-call warning.
ignore_no_config = true
