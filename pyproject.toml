[project]
name = "octomate"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2",
    "pyyaml>=6",
    "websockets>=15",
    "mem0ai>=0.1",
    "pymilvus>=2.6.9",
    "pixivpy-async>=1.2.14",
    "lark-oapi>=1.4.8",
    "pydantic-ai>=1.68.0",
    "zep-cloud>=3.0",
    "watchfiles>=1.1.1",
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]

[dependency-groups]
dev = [
    "watchfiles>=1.1.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
