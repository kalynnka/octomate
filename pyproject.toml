[project]
name = "octomate"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    # The server imports one module from it — `octomate_cli.stream`, the wire
    # protocol — and nothing else. The distribution edge also hands a server
    # install the `octomate` console script.
    "octomate-cli",
    "anyio>=4",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2",
    "pyyaml>=6",
    "websockets>=15",
    "lark-oapi>=1.4.8",
    "pydantic-ai[bedrock]>=2.20.0",
    "pydantic-graph>=2.20.0",
    "pydantic-ai-harness[code-mode]>=0.14",
    "watchfiles>=1.1.1",
    "arcanus>=0.0.25",
    "sqlalchemy[aiosqlite]>=2.0",
    "uuid-utils>=0.9",
    "alembic>=1.15",
    "aiosqlite>=0.22.1",
    # slack-bolt's async socket-mode handler needs aiohttp but does not declare it;
    # it used to arrive transitively through langchain.
    "aiohttp>=3.9",
    "slack-bolt>=1.18",
    "claude-agent-sdk>=0.1",
    "cryptography>=48",
    "google-genai>=1.55.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "logfire[httpx,sqlalchemy]>=4.29.0",
    "rich>=13",
    "openai-codex>=0.1.0b3",
    "typer>=0.25.1",
    "email-validator",
    # The gateway's own MCP server (`octomate.mcp.gateway`) and, in time, the
    # streamable-HTTP app it is served as. The client half already arrives with
    # pydantic-ai; the slim distribution is the same package without the CLI's
    # dependencies.
    "fastmcp-slim[server]>=3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["octomate"]

[tool.uv.workspace]
members = ["cli"]

[tool.uv.sources]
octomate-cli = { workspace = true }

[tool.ruff]
# The whole tree is `ruff format`ed at this width. Pinned rather than left implicit so
# a ruff upgrade cannot reflow every file at once; `target-version` stays inferred from
# `requires-python`.
line-length = 88

[tool.ruff.lint]
# Ruff is the gate: what it accepts is what the tree is allowed to contain. Pylance
# runs pyright in the editor, but its inference reports enough false positives here
# to make it advice rather than a verdict — so nothing is suppressed to satisfy it.
# Rules are listed one per line so adding one is a one-line, reviewable diff.
select = [
    "E4",     # imports: not-at-top, multiple on one line
    "E7",     # statement-level errors ruff enables by default
    "E9",     # syntax and IO errors
    "F",      # pyflakes: undefined names, unused imports and locals
    "ANN401", # `Any` in an annotation — AGENTS.md Typing 3
    "ASYNC",  # blocking calls and sleep-polling in async code
    "B",      # bugbear: mutable defaults, loop-variable capture, silent `zip` truncation
    "C4",     # comprehensions that rebuild what they already have
    "I",      # import order, matching what the editor already does on save
    "LOG",    # logging called in ways that drop the record
    "PGH",    # blanket `type: ignore` / `noqa` with no code — AGENTS.md Typing 7
    "PIE",    # statements with no effect
    "PT",     # pytest idiom: composite asserts, fixture returns, bare `raises`
    "RUF",    # ruff's own, incl. RUF012 mutable class defaults — AGENTS.md Typing 1
    "UP",     # syntax this `requires-python` has made redundant
]
ignore = [
    # Deprecated by ruff itself: `isinstance(x, A | B)` is not recommended practice, it
    # implies other typing syntax works there when it does not, and it is slower than the
    # tuple form. Ruff warns when it is selected by name; the `UP` prefix picks it up
    # silently, so it is turned off here rather than obeyed.
    "UP038",
]

# No `per-file-ignores`: a rule that has to bend bends at the line that bends it, with a
# `noqa` naming the rule and a reason. A pattern ignored file-wide keeps applying to code
# written later that never earned the exemption.

[dependency-groups]
dev = [
    "watchfiles>=1.1.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.28.1",
    "pytest-env>=1.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# `database_settings` is built when octomate.config.database is imported, which is
# before any fixture exists — so this is the only place the suite can keep it off
# the real .octomate/octomate.db. A test that forgets `in_memory_engine` then hits
# an in-memory database rather than writing to the developer's own.
env = ["OCTOMATE_DB_URL=sqlite+aiosqlite:///:memory:"]
filterwarnings = [
    # Channel profile schemas intentionally redeclare UserProfile fields (platform
    # aliases/defaults); the transmuter metaclass serves same-named class attributes,
    # which pydantic reports as shadowing. Mirrors the runtime filter in octomate/__init__.py,
    # which pytest's per-phase warning state does not preserve for late channel imports.
    'ignore:Field name "\w+" in "\w*(UserProfile|Sender)" shadows:UserWarning',
]
markers = [
    "trigger: live replay against a real IM client (needs octomate.yaml credentials); auto-skipped unless explicitly targeted",
]

[tool.logfire]
# Instrumented code paths (e.g. ChannelTentacle.ingest) run in tests and other
# entrypoints that never call logfire.configure(); silence the per-call warning.
ignore_no_config = true
