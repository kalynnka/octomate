# `~` (null) is a placeholder: the key falls back to its built-in default. Set a
# real value here or in octomate.yaml / env to override.
octomate:
  agents:
    inkling:
      models:
        - name: deepseek:deepseek-v4-flash
          settings:
            thinking: medium
        - name: deepseek:deepseek-v4-pro
      # Claims live in config beside the models they describe, for every
      # agent. A model with no claim is not summonable. Note an octomate.yaml
      # replaces this file's `octomate:` tree wholesale — a deployment that
      # lists its own models lists its own claims; `efforts` omitted means the
      # full scale.
      #
      # `efforts` is pydantic-ai's thinking scale, and for an OpenAI-compatible
      # provider the level is passed through to `reasoning_effort` verbatim —
      # nothing downgrades a grade the provider lacks. DeepSeek takes low,
      # medium, high and xhigh, so a claim that offers `minimal` advertises a
      # summon that answers 400.
      claims:
        "deepseek:deepseek-v4-flash":
          ability: Quick general assistant for everyday questions, chat, and
            light coordination.
          efforts: [low, medium]
        "deepseek:deepseek-v4-pro":
          ability: General assistant for writing, analysis, and coordinating
            multi-step work.
          efforts: [low, medium, high, xhigh]
      # Oversized tool returns are reduced by default: spilled past ~10k (lossless,
      # read back via `read_tool_result`), summarized past ~100k, and truncated if
      # either cannot run. Override `tool_output.bands` to change the thresholds,
      # `tool_output.retention_hours` for how long a spill stays readable, or
      # `tool_output.enabled: false` to send every return whole.
      # permission_mode: default
      #   # default | dontAsk | bypassPermissions
      #   # what a conversation falls back to when it carries no posture of its own:
      #   # park every deferral for a human, answer questions in-process so the agent
      #   # decides for itself, or grant approvals without a card. Claude's scale,
      #   # narrowed to what deferred resolution can honor.
    # Anthropic Claude Code agent (opt-in; omitted => absent). Runs the Claude
    # Agent SDK locally. List it in a channel's `agents:` to make it a summon
    # candidate.
    # claude:
    #   cwd: .
    #   models: [opus, sonnet, haiku]   # opus => Opus 4.8
    #   # A claim advertises what a route is for and the effort levels it
    #   # accepts (omitted efforts = full scale). A model with no claim is not
    #   # summonable — list a claim for every model you expose.
    #   claims:
    #     opus:
    #       ability: Coding agent for deep, multi-step engineering across a
    #         repository.
    #     sonnet:
    #       ability: Coding agent for everyday software tasks and mid-sized
    #         changes.
    #     haiku:
    #       ability: Fast coding agent for small, well-scoped fixes and
    #         repository chores.
    #   # permission_mode: default
    #   #   # default | acceptEdits | plan | bypassPermissions | dontAsk | auto
    #   #   # what a conversation falls back to when it carries no posture of its
    #   #   # own. The SDK's own scale, handed over verbatim.
    #   # max_turns: ~
    #   # approval_timeout: ~   # seconds to wait for a human approval; ~ = forever
    #   # ssh: ~                # remote runs are disabled: a run happens in its
    #   #                       # thread's project root, and that is a local path
    #   #                       # the remote host has nothing to match. Setting a
    #   #                       # block is refused rather than ignored.
    # OpenAI Codex agent (opt-in; omitted => absent). Runs Codex through the
    # openai-codex SDK. List it in a channel's `agents:` to make it a summon
    # candidate.
    # codex:
    #   enabled: true
    #   cwd: .
    #   runtime:
    #     # codex_bin: /opt/bin/codex
    #     config_overrides: []
    #   models: [gpt-5.5, gpt-5.5-pro, gpt-5.3-codex, gpt-5.1-codex-mini]
    #   # A model with no claim is not summonable — list a claim for every
    #   # model you expose (omitted efforts = full scale).
    #   claims:
    #     gpt-5.5:
    #       ability: Codex agent for general software engineering across a
    #         repository.
    #     gpt-5.5-pro:
    #       ability: Deep-reasoning Codex agent for large, difficult
    #         engineering work across a repository.
    #     gpt-5.3-codex:
    #       ability: Codex agent tuned for hands-on coding tasks and mid-sized
    #         changes.
    #     gpt-5.1-codex-mini:
    #       ability: Fast Codex agent for small, well-scoped code edits and
    #         quick fixes.
    #   permission_mode: user_review
    #     # user_review | auto_review | deny_all
    #     # who answers when the agent asks to step past the sandbox
    #   approval_timeout: ~        # seconds to wait for human approval; ~ = forever
    #   sandbox: workspace_write   # read_only | workspace_write | full_access
    #     # what a command may touch when nobody is asked; fixed for a run
    #   effort: ~                  # none | minimal | low | medium | high | xhigh
    #   summary: ~                 # auto | concise | detailed | none
    #   personality: ~             # none | friendly | pragmatic
    #   max_clients: 8             # warm app-server processes kept in the pool; ~ = unbounded
    #   client_idle_ttl: 600       # seconds an idle pooled client lives; ~ = until shutdown

  logging:
    level: ~   # default: INFO

  # Observability. send_to_logfire is opt-in: it only ships when true AND a
  # LOGFIRE_TOKEN is present. scrub redacts identifier attributes (conversation
  # key, user/chat/message ids) in the backend while keeping channel/run labels.
  # instrument.* toggles per-library auto-instrumentation, all off by default —
  # each traces a whole library's internals (every request / statement / model
  # call). Octomate's own spans are not behind these: they always emit whenever
  # tracing itself is on.
  logfire:
    service_name: ~     # default: octomate
    environment: ~      # default: development
    send_to_logfire: ~  # default: false
    console: ~          # default: false
    scrub: ~            # default: true
    instrument:
      pydantic_ai: ~    # default: false — model requests, tool calls, usage per run
      httpx: ~          # default: false — every outbound HTTP request
      sqlalchemy: ~     # default: false — every SQL statement

  # Runtime IM channels. Keep disabled examples here and put real secrets in
  # octomate.yaml or environment variables.
  channels: {}
  # channels:
  #   slack:
  #     agents:
  #       - agent: inkling
  #         model: deepseek:deepseek-v4-flash
  #       - agent: codex
  #         model: gpt-5.5-codex
  #     app_id: A...
  #     bot_token: xoxb-...
  #     app_token: xapp-...
  #     stream:
  #       flush_interval: 0.2
  #       min_chars: 20
  #   lark:
  #     agents:
  #       - agent: inkling
  #         model: deepseek:deepseek-v4-flash
  #       - agent: claude
  #         model: opus
  #       - agent: codex
  #         model: gpt-5.5-codex
  #     app_id: cli_...
  #     app_secret: ...
  #     stream:
  #       flush_interval: 0.2
  #       min_chars: 20
  #   napcat:
  #     agents:
  #       - agent: inkling
  #         model: deepseek:deepseek-v4-flash
  #       - agent: codex
  #         model: gpt-5.5-codex
  #     stream:
  #       enabled: false
  #     ws_url: ws://127.0.0.1:3001
  #     http_url: http://127.0.0.1:3000

  # LLM providers. Every block is optional; an omitted block falls back to the
  # provider's native env vars (OPENAI_API_KEY, GOOGLE_API_KEY/GEMINI_API_KEY,
  # ANTHROPIC_API_KEY, DEEPSEEK_API_KEY, AWS_* ...). Put real secrets in
  # octomate.yaml or environment variables.
  providers: {}
  # providers:
  #   openai:
  #     api_key: sk-...
  #     base_url: https://api.openai.com/v1
  #   deepseek:
  #     api_key: sk-...
  #   gemini:              # Google AI Studio (Developer API)
  #     api_key: AIza...
  #   vertex:              # Gemini via Vertex AI
  #     project: my-gcp-project
  #     location: global
  #     credentials_file: /secrets/sa.json   # omit => Application Default Credentials
  #   anthropic:
  #     api_key: sk-ant-...
  #   bedrock:
  #     region_name: us-east-1
  #     aws_access_key_id: AKIA...
  #     aws_secret_access_key: ...
  #     # or: profile_name: my-profile
  #     # or: api_key: <AWS_BEARER_TOKEN_BEDROCK>

  # Bare vendor MCP servers connected over Streamable HTTP with one operator token.
  # Tools are deferred-loaded until the model discovers them through ToolSearch.
  mcp: {}
  # mcp:
  #   notion:                     # the key names the server: MCP session id and tool prefix
  #     url: https://mcp.notion.com/mcp
  #     token: ntn_xxx            # or OCTOMATE__MCP__NOTION__TOKEN
  #     prefix: nt                # tool-name prefix (default: the key above)
  #     enabled: true             # default: true
  #     warm_timeout_seconds: 16  # seconds to warm this server (default 16)

  # Per-user OAuth integrations: each registered user authorizes their own account
  # from their channel, and the integration mounts its MCP server with that user's
  # encrypted token. The key is the connector id — it keys stored connections, names
  # the capability, and prefixes the tools — so one vendor can be mounted once per
  # account. `type` picks the provider that builds it.
  integrations: {}
  # integrations:
  #   github:                       # device flow: the user types a code, no callback
  #     type: github
  #     enabled: true
  #     client_id: Iv1.xxxxx        # required — OAuth App with Device Flow enabled
  #     scopes: [repo, read:org]    # fixed at authorization; widening = reconnect
  #     max_cached_users: 32        # warm per-user sessions before LRU close
  #     mcp:
  #       read_only: false          # true => the /readonly endpoint variant
  #       prefix: gh                # tool-name prefix (default: the key above)
  #   linear_me:                    # authorization code: approved in a browser
  #     type: linear
  #     enabled: true
  #     client_id: xxxxx            # required — OAuth application in Linear settings
  #     client_secret: xxxxx        # optional (PKCE covers it); prefer the env var
  #     # Where the authorizing BROWSER reaches Octomate, not where the internet
  #     # does — Linear redirects the user agent, it never connects here. Register
  #     # <callback_base_uri>/oauth/<key>/callback on the Linear application; it
  #     # must match character for character.
  #     callback_base_uri: http://localhost:8000
  #     scopes: [read, write]

  # Encrypts pending device codes, authorization-code state and PKCE verifiers, and
  # user OAuth tokens at rest. Prefer the OCTOMATE__OAUTH__ENCRYPTION_KEY environment
  # variable over YAML. Generate a key with: openssl rand -base64 32 | tr '+/' '-_'
  oauth: {}

# Live-replay test targets (`pytest tests/trigger/`).
# This section sits OUTSIDE `octomate:` — the application never reads it.
# Configure it in the gitignored octomate.yaml, next to the channel credentials:
# trigger:
#   slack: {chat_id: D0123, user_id: U0123}    # each run opens its own thread in the DM
#   lark: {chat_type: group, chat_id: oc_xxx, user_id: ou_xxx}
#   napcat: {chat_id: "123456", user_id: "123456"}
