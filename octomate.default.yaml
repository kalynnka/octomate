# `~` (null) is a placeholder: the key falls back to its built-in default. Set a
# real value here or in octomate.yaml / env to override.
octomate:
  agents:
    inkling:
      models:
        - name: deepseek:deepseek-v4-flash
          settings:
            thinking: medium
        - name: deepseek:deepseek-v4-pro
    # Anthropic Claude Code agent (opt-in; omitted => absent). Runs the Claude
    # Agent SDK locally, or on a remote host when `ssh` is set. List it in a
    # channel's `agents:` to make it a summon candidate.
    # claude:
    #   cwd: .
    #   models: [opus, sonnet, haiku]   # opus => Opus 4.8
    #   # max_turns: ~
    #   # approval_timeout: ~   # seconds to wait for a human approval; ~ = forever
    #   # ssh:                  # run `claude` on a remote host instead of locally
    #   #   host: my-host
    #   #   identity_file: ~/.ssh/id_ed25519
    # OpenAI Codex agent (opt-in; omitted => absent). Runs Codex through the
    # openai-codex SDK. List it in a channel's `agents:` to make it a summon
    # candidate.
    # codex:
    #   enabled: true
    #   cwd: .
    #   runtime:
    #     # codex_bin: /opt/bin/codex
    #     config_overrides: []
    #   models: [gpt-5.5, gpt-5.5-pro, gpt-5.3-codex, gpt-5.1-codex-mini]
    #   approval_mode: user        # user | auto_review | deny_all
    #   approval_timeout: ~        # seconds to wait for human approval; ~ = forever
    #   sandbox: workspace_write   # read_only | workspace_write | full_access
    #   effort: ~                  # none | minimal | low | medium | high | xhigh
    #   summary: ~                 # auto | concise | detailed | none
    #   personality: ~             # none | friendly | pragmatic
    #   max_clients: 8             # warm app-server processes kept in the pool; ~ = unbounded
    #   client_idle_ttl: 600       # seconds an idle pooled client lives; ~ = until shutdown

  logging:
    level: ~   # default: INFO

  # Observability. send_to_logfire is opt-in: it only ships when true AND a
  # LOGFIRE_TOKEN is present. scrub redacts identifier attributes (conversation
  # key, user/chat/message ids) in the backend while keeping channel/run labels.
  logfire:
    service_name: ~     # default: octomate
    environment: ~      # default: development
    send_to_logfire: ~  # default: false
    console: ~          # default: false
    scrub: ~            # default: true

  # Runtime IM channels. Keep disabled examples here and put real secrets in
  # octomate.yaml or environment variables.
  channels: {}
  # channels:
  #   slack:
  #     agents:
  #       - agent: inkling
  #         model: deepseek:deepseek-v4-flash
  #       - agent: codex
  #         model: gpt-5.5-codex
  #     app_id: A...
  #     bot_token: xoxb-...
  #     app_token: xapp-...
  #     stream:
  #       flush_interval: 0.2
  #       min_chars: 20
  #   lark:
  #     agents:
  #       - agent: inkling
  #         model: deepseek:deepseek-v4-flash
  #       - agent: claude
  #         model: opus
  #       - agent: codex
  #         model: gpt-5.5-codex
  #     app_id: cli_...
  #     app_secret: ...
  #     stream:
  #       flush_interval: 0.2
  #       min_chars: 20
  #   napcat:
  #     agents:
  #       - agent: inkling
  #         model: deepseek:deepseek-v4-flash
  #       - agent: codex
  #         model: gpt-5.5-codex
  #     stream:
  #       enabled: false
  #     ws_url: ws://127.0.0.1:3001
  #     http_url: http://127.0.0.1:3000

  # LLM providers. Every block is optional; an omitted block falls back to the
  # provider's native env vars (OPENAI_API_KEY, GOOGLE_API_KEY/GEMINI_API_KEY,
  # ANTHROPIC_API_KEY, DEEPSEEK_API_KEY, AWS_* ...). Put real secrets in
  # octomate.yaml or environment variables.
  providers: {}
  # providers:
  #   openai:
  #     api_key: sk-...
  #     base_url: https://api.openai.com/v1
  #   deepseek:
  #     api_key: sk-...
  #   gemini:              # Google AI Studio (Developer API)
  #     api_key: AIza...
  #   vertex:              # Gemini via Vertex AI
  #     project: my-gcp-project
  #     location: global
  #     credentials_file: /secrets/sa.json   # omit => Application Default Credentials
  #   anthropic:
  #     api_key: sk-ant-...
  #   bedrock:
  #     region_name: us-east-1
  #     aws_access_key_id: AKIA...
  #     aws_secret_access_key: ...
  #     # or: profile_name: my-profile
  #     # or: api_key: <AWS_BEARER_TOKEN_BEDROCK>

  # Vendor MCP servers (GitHub, Linear) connected over Streamable HTTP with one
  # operator token each. Tools are deferred-loaded: hidden until the model
  # discovers them via ToolSearch. Put real tokens in octomate.yaml or env.
  mcp: {}
  # mcp:
  #   github:
  #     enabled: true
  #     token: ghp_xxx            # or OCTOMATE__MCP__GITHUB__TOKEN
  #     read_only: false          # true => the /readonly endpoint variant
  #   linear:
  #     enabled: true
  #     token: lin_api_xxx        # or OCTOMATE__MCP__LINEAR__TOKEN

# Live-replay test targets (`pytest tests/trigger/`).
# This section sits OUTSIDE `octomate:` — the application never reads it.
# Configure it in the gitignored octomate.yaml, next to the channel credentials:
# trigger:
#   slack: {chat_id: D0123, user_id: U0123}    # each run opens its own thread in the DM
#   lark: {chat_type: group, chat_id: oc_xxx, user_id: ou_xxx}
#   napcat: {chat_id: "123456", user_id: "123456"}
