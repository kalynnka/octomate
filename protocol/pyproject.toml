[project]
name = "octomate-protocol"
version = "0.0.1"
description = "Shared stream and deployment contracts for Octomate and its CLI."
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["octomate_protocol"]
