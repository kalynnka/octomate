# Logging and tracing.
#
# send_to_logfire is opt-in: telemetry only ships when it is true AND a
# LOGFIRE_TOKEN is present. scrub redacts identifier attributes (conversation key,
# user/chat/message ids) in the backend while keeping channel/run labels.
#
# instrument.* toggles per-library auto-instrumentation, all off by default — each
# traces a whole library's internals (every request / statement / model call).
# Octomate's own spans are not behind these: they always emit whenever tracing
# itself is on.

# logging:
#   level: INFO
#   loggers:                # per-logger overrides applied on top of `level`
#     httpx: WARNING

# logfire:
#   service_name: octomate
#   environment: development
#   send_to_logfire: false
#   console: false
#   scrub: true
#   instrument:
#     pydantic_ai: false    # model requests, tool calls, usage per run
#     httpx: false          # every outbound HTTP request
#     sqlalchemy: false     # every SQL statement
