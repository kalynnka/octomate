# Agent tentacles.
#
# Every agent is opt-in, and an omitted block means the agent is absent rather than
# disabled. Nothing is declared here on purpose: which LLM you hold keys for is not
# something this project can guess, and a defaulted model would be a route that boots
# fine and 401s on first use.
#
# Claude, Codex and DeepSeek Harness supply their own model catalogs and providers;
# default selections stay with the harness. Inkling needs a models list; its first model is
# the default. Every model of an agent bound to a channel is available there.
#
# Claims describe routes and their supported thinking efforts. For harnesses,
# configure a claim only for metadata the harness omits, keyed by provider:model.
# Reported descriptions and effort capabilities take precedence over claims.
#
# A home that declares `tentacles:` replaces this whole block.

# tentacles:

  # The in-process pydantic-ai agent. Takes any pydantic-ai model id and reaches each
  # provider through `providers.yaml`, or that provider's own environment variable.
  #
  # inkling:
  #   type: inkling
  #   models:
  #     - name: anthropic:claude-sonnet-5
  #     - name: anthropic:claude-opus-5
  #       settings:
  #         thinking: high
  #   claims:
  #     "anthropic:claude-sonnet-5":
  #       ability: General assistant for everyday questions, writing, and
  #         coordinating multi-step work.
  #     "anthropic:claude-opus-5":
  #       ability: Heavyweight assistant for hard reasoning, deep analysis, and
  #         long-form writing.
  #
  #   # Oversized tool returns are reduced by default: spilled past ~10k (lossless,
  #   # read back via `read_tool_result`), summarized past ~100k, and truncated if
  #   # either cannot run. Override `tool_output.bands` to change the thresholds,
  #   # `tool_output.retention_hours` for how long a spill stays readable, or
  #   # `tool_output.enabled: false` to send every return whole.
  #   #
  #   # permission_mode is what a conversation falls back to when it carries no
  #   # posture of its own: `default` parks every deferral for a human, `dontAsk`
  #   # answers questions in-process so the agent decides for itself, and
  #   # `bypassPermissions` grants approvals without a card. Claude's scale,
  #   # narrowed to what deferred resolution can honor.
  #   permission_mode: default
  #   request_limit: 256   # maximum model requests in one Inkling run

  # Anthropic Claude Code agent. Runs the Claude Agent SDK locally, and serves the
  # hook router native sessions report into, authenticated with the user's
  # API token (hooks scope).
  #
  # claude:
  #   type: claude
  #   enabled: true
  #
  #   # The SDK's own scale, handed over verbatim:
  #   # default | acceptEdits | plan | bypassPermissions | dontAsk | auto
  #   permission_mode: default
  #   max_turns: ~
  #   approval_timeout: 3600   # seconds before a card expires; ~ = forever
  #   ssh: ~                # remote runs are disabled: a run happens in its
  #                         # thread's project root, and that is a local path the
  #                         # remote host has nothing to match. Setting a block is
  #                         # refused rather than ignored.

  # OpenAI Codex agent. Runs Codex through the openai-codex SDK, and serves its own
  # hook router.
  #
  # codex:
  #   type: codex
  #   enabled: true
  #   runtime:
  #     # codex_bin: /opt/bin/codex
  #     config_overrides: []
  #
  #   # Ask for approval | Approve for me | Full access:
  #   # user_review and auto_review use a workspace sandbox with network review.
  #   # full_access removes the sandbox and approval prompts.
  #   permission_mode: user_review   # user_review | auto_review | full_access
  #   approval_timeout: 3600     # seconds before a card expires; ~ = forever
  #   effort: ~                  # none | minimal | low | medium | high | xhigh
  #   summary: ~                 # auto | concise | detailed | none
  #   personality: ~             # none | friendly | pragmatic
  #   max_clients: 8             # warm app-server processes pooled; ~ = unbounded
  #   client_idle_ttl: 600       # seconds an idle pooled client lives; ~ = forever

  # WIP DeepSeek Harness agent. Owns a `dsh web` child with private extension
  # configuration, sharing native settings, credentials, sessions and attachments.
  #
  # deepseek:
  #   type: deepseek
  #   enabled: true
  #   host: 127.0.0.1            # authenticated loopback gateway
  #   port: 3081                 # separate from native dsh's 3080; must be free
  #   executable: dsh            # on PATH, or an absolute path to a built dsh
  #   extra_args: []             # Octomate-managed overlays, e.g. --patch <path>
  #   dsh_home: ~/.dsh           # shared data source; local extension config is ignored
  #
  #   # dsh's shipped presets, each bundling sandbox mode and approval policy:
  #   # workspace-write | danger-full-access
  #   permission_mode: workspace-write
  #   agent_preset: ~            # session.create agentPreset; ~ = dsh's default
  #   approval_timeout: 3600     # seconds before a card expires; ~ = forever
  #   ready_timeout: 60          # seconds to wait for the `dsh web:` banner

# Channel tentacles, keyed by instance id with `type` selecting the platform — so a
# deployment can run two Lark apps, or two consoles, by naming them apart. The key is
# the channel tentacle id everywhere downstream: what a stored profile names, and
# what a thread records as its origin. Renaming a key therefore re-homes its threads,
# so pick one and keep it.
#
# Every channel binds at least one agent ID. The first agent answers by default,
# using its harness default (or Inkling's first configured model). All models of
# every bound agent are available from the channel.
#
# Nothing is declared here, the web console included. Keep real secrets in the
# environment (OCTOMATE__TENTACLES__<KEY>__<FIELD>) rather than in a config home; the
# examples below show the shape, not the practice.

#   trunkline:                    # the web console
#     type: trunkline
#     static_dir: /absolute/path/to/trunkline/dist  # omit for console API only
#     agents:
#       - inkling
#   slack:
#     type: slack
#     agents:
#       - inkling
#       - codex
#     app_id: A...
#     bot_token: xoxb-...
#     app_token: xapp-...
#     stream:
#       flush_interval: 0.2
#       min_chars: 20
#
#   discord:
#     type: discord
#     agents:
#       - inkling
#     # Set OCTOMATE__TENTACLES__DISCORD__BOT_TOKEN in .env.
#     stream:
#       enabled: true
#       flush_interval: 0.2
#
#   # Two Lark apps side by side: same `type`, different keys, separate threads.
#   lark_main:
#     type: lark
#     agents:
#       - inkling
#       - claude
#     app_id: cli_...
#     app_secret: ...
#     stream:
#       flush_interval: 0.2
#       min_chars: 20
#   lark_ops:
#     type: lark
#     agents:
#       - claude
#     app_id: cli_...
#     app_secret: ...
#
#   napcat:
#     type: napcat
#     agents:
#       - inkling
#     stream:
#       enabled: false
#     ws_url: ws://127.0.0.1:3001
#     http_url: http://127.0.0.1:3000

# MCP tentacles offer connection settings that users explicitly install.
# The configured key identifies the template users install.
#
# OAuth templates require `oauth.encryption_key`. The `oauth_discovery` type also
# requires `oauth.callback_base_uri`. It discovers endpoints and uses Dynamic Client
# Registration (DCR) or Client ID Metadata Documents (CIMD) when users connect.
# Use `oauth` for a pre-registered application instead.

#   linear:
#     type: oauth_discovery
#     url: https://mcp.linear.app/mcp

#   notion:                       # one operator token for every caller
#     type: bare
#     url: https://mcp.notion.com/mcp
#     token: ntn_xxx              # or OCTOMATE__TENTACLES__NOTION__TOKEN
#     enabled: true               # default: true
