# Encrypts pending device codes, authorization-code state and PKCE verifiers, and
# user OAuth tokens at rest. Required once any integration is enabled.
#
# Prefer OCTOMATE__OAUTH__ENCRYPTION_KEY in the environment over a config home.
# Generate a key with: openssl rand -base64 32 | tr '+/' '-_'

# oauth:
#   # Public Octomate origin shared by OAuth callbacks and profile-linking URLs.
#   callback_base_uri: https://octomate.example.com
#   # Browser authorization and binding links; device expiry is provider-issued.
#   authorization_lifetime: PT10M
#   encryption_key: ...
