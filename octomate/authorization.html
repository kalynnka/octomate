<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Authorize access · Octomate</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
  <link rel="stylesheet" href="/oauth/design/lonetrail.css">
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    :root { color-scheme: light; --consent-grain-a: 3.2%; --consent-grain-b: 2.4%; }
    [data-theme="dark"] { color-scheme: dark; --consent-grain-a: 1.6%; --consent-grain-b: 1.2%; }
    body { margin: 0; min-height: 100dvh; padding: 40px 24px; display: grid; place-items: center; background-color: var(--page-bg); color: var(--fg-1); font: var(--ui); }
    body {
      background-image: radial-gradient(color-mix(in srgb, var(--color-ink) var(--consent-grain-a), transparent) 0.5px, transparent 0.6px), radial-gradient(color-mix(in srgb, var(--color-ink) var(--consent-grain-b), transparent) 0.5px, transparent 0.6px);
      background-size: 4px 4px, 7px 7px;
      background-position: 0 0, 2px 3px;
    }
    main { position: relative; width: 100%; max-width: 480px; padding: 30px; background: var(--card-bg); border: 1px solid var(--line-divider); box-shadow: var(--shadow-soft); }
    .bracket { position: absolute; width: 11px; height: 11px; border-color: color-mix(in srgb, var(--color-ink) 42%, transparent); border-style: solid; border-width: 0; pointer-events: none; }
    .bracket:nth-child(1) { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; }
    .bracket:nth-child(2) { top: -1px; right: -1px; border-top-width: 2px; border-right-width: 2px; }
    .bracket:nth-child(3) { bottom: -1px; left: -1px; border-bottom-width: 2px; border-left-width: 2px; }
    .bracket:nth-child(4) { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; }
    .brand { font: 400 16px/1.3 var(--font-display); letter-spacing: var(--track-wide); color: var(--fg-2); text-transform: uppercase; }
    h1 { font: 500 clamp(24px, 5vw, 28px)/1.3 var(--font-sans); letter-spacing: var(--track-tight); color: var(--fg-1); text-wrap: balance; margin: 20px 0 10px; }
    p { font: 400 14px/1.65 "Noto Serif SC", serif; }
    #status { color: var(--fg-2); margin: 0 0 22px; }
    #error { color: var(--color-red); margin: 16px 0; }
    #error:empty { display: none; }
    label { display: block; margin-top: 18px; }
    .field-label, dt { font: var(--label-xs); letter-spacing: var(--track-wide); text-transform: uppercase; color: var(--fg-2); }
    input { display: block; width: 100%; margin-top: 8px; padding: 11px 12px; border: 1px solid var(--color-border); border-radius: var(--radius-large); background: var(--surface-sunken); color: var(--fg-1); font: var(--ui); caret-color: var(--color-accent); }
    :focus-visible { outline: 2px solid var(--info-strong); outline-offset: 3px; }
    ::selection { background: color-mix(in srgb, var(--color-accent) 25%, transparent); }
    dl { margin: 0; }
    .field { padding: 16px 0; border-bottom: 1px solid var(--line-divider); }
    .field:first-child { padding-top: 0; }
    dd { margin: 8px 0 0; overflow-wrap: anywhere; font: 400 15px/1.6 "Noto Serif SC", serif; }
    #client { font: 500 17px/1.45 var(--font-sans); color: var(--fg-1); }
    .hint { display: block; margin-top: 5px; font: 400 12px/1.5 "Noto Serif SC", serif; color: var(--fg-2); }
    #account, .address { font: 400 12px/1.7 var(--font-mono); }
    #scopes { padding-left: 18px; margin: 0; }
    #scopes li + li { margin-top: 6px; }
    .notice { padding: 11px 13px; margin: 20px 0 0; border-left: 3px solid var(--color-gold); background: color-mix(in srgb, var(--color-ink) 3%, transparent); }
    .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 24px; }
    button { min-height: 44px; padding: 11px 16px; border: 1px solid var(--color-border); border-radius: var(--radius-large); background: transparent; color: var(--fg-1); cursor: pointer; font: var(--label); line-height: 1.4; letter-spacing: var(--track-wide); text-transform: uppercase; transition: background-color 150ms linear, color 150ms linear; }
    button:hover { background: var(--surface-sunken); }
    .primary { background: color-mix(in srgb, var(--color-accent) 12%, var(--card-bg)); color: var(--fg-1); border-color: var(--color-accent); }
    .primary:hover { background: color-mix(in srgb, var(--color-accent) 20%, var(--card-bg)); }
    button:disabled { opacity: .55; cursor: default; }
    @media (max-width: 520px) {
      body { padding: 20px 12px; }
      main { padding: 24px 20px; }
      .actions button { flex: 1; }
    }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body><main aria-labelledby="title">
  <span class="bracket" aria-hidden="true"></span><span class="bracket" aria-hidden="true"></span>
  <span class="bracket" aria-hidden="true"></span><span class="bracket" aria-hidden="true"></span>
  <header>
    <div class="brand">Octomate</div>
    <h1 id="title">Authorize access</h1>
    <p id="status" role="status">Loading request…</p>
  </header>
  <form id="login" hidden>
    <label><span class="field-label">Username</span><input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label><span class="field-label">Password</span><input name="password" type="password" autocomplete="current-password" required></label>
    <div class="actions"><button class="primary">Sign in</button></div>
  </form>
  <section id="consent" hidden aria-label="Authorization request">
    <dl>
      <div class="field"><dt>Application</dt><dd><span id="client"></span><span class="hint">Name supplied by the client</span></dd></div>
      <div class="field"><dt>Signed in as</dt><dd id="account"></dd></div>
      <div class="field"><dt>Access requested</dt><dd><ul id="scopes"></ul></dd></div>
      <div class="field"><dt>Server</dt><dd id="resource" class="address"></dd></div>
      <div class="field"><dt>Return address</dt><dd id="redirect" class="address"></dd></div>
    </dl>
    <p class="notice">Only approve if you started this connection and recognize the application.</p>
    <div class="actions">
      <button id="deny" type="button">Deny</button>
      <button id="approve" class="primary" type="button">Allow access</button>
    </div>
  </section>
  <p id="error" role="alert"></p>
</main>
<script>
  const colorScheme = matchMedia('(prefers-color-scheme: dark)');
  let theme = 'auto';
  try { theme = localStorage.getItem('trk-theme') || 'auto'; }
  catch { /* Match Trunkline's system theme when storage is unavailable. */ }
  function applyTheme() {
    document.documentElement.dataset.theme = theme === 'dark' || (theme === 'auto' && colorScheme.matches) ? 'dark' : 'light';
  }
  applyTheme();
  colorScheme.addEventListener('change', applyTheme);
  const ticket = new URLSearchParams(location.hash.slice(1)).get('ticket');
  const status = document.getElementById('status');
  const error = document.getElementById('error');
  const login = document.getElementById('login');
  const consent = document.getElementById('consent');
  let userId;
  const scopeNames = {mcp: 'Use tools and conversations through MCP', hooks: 'Upload agent sessions and send hooks', acp: 'Connect through ACP'};
  async function post(path, body) {
    return fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json', 'X-Octomate-Request': '1'}, body: JSON.stringify(body)});
  }
  async function inspect() {
    consent.hidden = true;
    let response = await post('/oauth/consent/inspect', {ticket});
    if (response.status === 401) {
      const refreshed = await post('/api/auth/refresh', {});
      if (refreshed.ok) response = await post('/oauth/consent/inspect', {ticket});
    }
    if (response.status === 401) {
      login.hidden = false;
      status.textContent = 'Sign in to review the request.';
      return;
    }
    if (!response.ok) throw new Error('This request is invalid or expired. Start again from your application.');
    const data = await response.json();
    userId = data.user_id;
    document.getElementById('client').textContent = data.client_name;
    document.getElementById('account').textContent = data.username;
    document.getElementById('scopes').replaceChildren(...data.scopes.map(scope => {
      const item = document.createElement('li');
      item.textContent = scopeNames[scope];
      return item;
    }));
    document.getElementById('resource').textContent = data.resource;
    document.getElementById('redirect').textContent = data.redirect_uri;
    login.hidden = true;
    consent.hidden = false;
    status.textContent = 'Review this request before continuing.';
  }
  login.addEventListener('submit', async event => {
    event.preventDefault();
    const button = login.querySelector('button');
    button.disabled = true;
    button.textContent = 'Signing in…';
    error.textContent = '';
    try {
      const form = new FormData(login);
      const response = await post('/api/auth/login', {username: form.get('username'), password: form.get('password')});
      login.elements.password.value = '';
      if (!response.ok) throw new Error('Sign-in failed. Check your username and password.');
      await inspect();
    } catch (failure) { error.textContent = failure.message; }
    finally { button.disabled = false; button.textContent = 'Sign in'; }
  });
  async function decide(approve) {
    const buttons = consent.querySelectorAll('button');
    const action = document.getElementById(approve ? 'approve' : 'deny');
    action.textContent = approve ? 'Authorizing…' : 'Denying…';
    buttons.forEach(button => button.disabled = true);
    error.textContent = '';
    try {
      const response = await post('/oauth/consent/decide', {ticket, expected_user_id: userId, approve});
      if (response.status === 409) {
        await inspect();
        throw new Error('Your account changed. Review the request again.');
      }
      if (!response.ok) throw new Error('Authorization failed. Start again from your application.');
      location.assign((await response.json()).redirect_uri);
    } catch (failure) { error.textContent = failure.message; }
    finally { buttons.forEach(button => button.disabled = false); action.textContent = approve ? 'Allow access' : 'Deny'; }
  }
  document.getElementById('approve').addEventListener('click', () => decide(true));
  document.getElementById('deny').addEventListener('click', () => decide(false));
  if (ticket) inspect().catch(failure => { status.textContent = ''; error.textContent = failure.message; });
  else status.textContent = 'Start authorization from your application.';
</script>
</body>
</html>
