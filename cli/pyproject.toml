[project]
name = "octomate-cli"
version = "0.0.2"
description = "Octomate's client half: the operator CLI, native-session hook clients, and the transcript tail."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# Deliberately light: ordinary client commands do not import the server package.
# Internal deployment maintenance runs in the installed service environment.
dependencies = [
    "octomate-protocol>=0.0.1,<0.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.1",
    "questionary>=2.1,<3",
    "rich>=13",
    "tomlkit>=0.13.2",
    "typer>=0.25.1",
    "watchfiles>=1.1.1",
    "websockets>=15",
]

[project.urls]
Repository = "https://github.com/kalynnka/octomate"
Documentation = "https://github.com/kalynnka/octomate/blob/main/cli/README.md"
Issues = "https://github.com/kalynnka/octomate/issues"

[project.scripts]
octomate = "octomate_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["octomate_cli"]
