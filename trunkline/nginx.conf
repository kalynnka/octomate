map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Preserve HTTPS when a private ingress such as Tailscale terminates TLS.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}

upstream octomate_backend {
    zone octomate_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server octomate:8000 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 0;

    location ~ ^/(api|oauth|hooks|octomate|docs|redoc|openapi\.json)(/|$) {
        proxy_pass http://octomate_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
